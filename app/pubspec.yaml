name: team_chat
description: "团队通 TeamChat - 面向团队内部的端到端加密聊天工具"
publish_to: "none"
version: 1.2.0+5

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.6.0
  cryptography: ^2.7.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  file_picker: ^13.1.0
  pasteboard: ^0.5.0
  desktop_multi_window: ^0.3.1
  window_manager: ^0.5.2
  audioplayers: ^6.8.1
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  mime: ^1.0.5
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
