name: Release

# 推送 v* 标签（如 v1.0.0）即自动构建全平台安装包并发布到 GitHub Release。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            file: teamchat-windows-x64.zip
          - os: ubuntu-latest
            target: linux
            file: teamchat-linux-x64.tar.gz
          - os: macos-latest
            target: macos
            file: teamchat-macos.zip
          - os: ubuntu-latest
            target: apk
            file: teamchat-android.apk
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config liblzma-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Set up Java (Android)
        if: matrix.target == 'apk'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: flutter pub get

      - name: Preinstall Android NDK
        if: matrix.target == 'apk'
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ ! -d "$SDK/ndk/28.2.13676358" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" \
              || yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk/28.2.13676358"
          fi

      - name: Build Windows
        if: matrix.target == 'windows'
        run: flutter build windows --release

      - name: Build Linux
        if: matrix.target == 'linux'
        run: flutter build linux --release

      - name: Build macOS
        if: matrix.target == 'macos'
        run: flutter build macos --release

      - name: Build Android APK
        if: matrix.target == 'apk'
        run: flutter build apk --release

      # ---------- 打包 ----------
      - name: Package Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ../${{ matrix.file }}

      - name: Package Linux
        if: matrix.target == 'linux'
        run: tar -C build/linux/x64/release -czf ../${{ matrix.file }} bundle

      - name: Package macOS
        if: matrix.target == 'macos'
        run: ditto -c -k --keepParent build/macos/Build/Products/Release/*.app ../${{ matrix.file }}

      - name: Package Android
        if: matrix.target == 'apk'
        run: cp build/app/outputs/flutter-apk/app-release.apk ../${{ matrix.file }}

      # ---------- 发布 ----------
      - name: Upload to release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.file }}
          # 仅由一个任务生成 release notes，避免多个任务重复追加
          generate_release_notes: ${{ matrix.target == 'windows' }}

      - name: Upload workflow artifact (manual run)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: ${{ matrix.file }}
